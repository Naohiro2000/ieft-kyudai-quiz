<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ひぐりんご - 九大プログラム学習</title>
<style>
  :root { --accent:#ff6b35; --bg:#fafafa; --card:#fff; --text:#222; --muted:#888; --good:#2e9e4f; --bad:#e0453c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--text); }
  .screen { max-width:480px; margin:0 auto; min-height:100vh; padding:16px; display:flex; flex-direction:column; }
  h1 { font-size:1.3rem; margin:8px 0 20px; text-align:center; }
  .card { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:16px; }
  select, button, input { font-size:1rem; padding:14px; border-radius:12px; border:1px solid #ddd; width:100%; }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; margin-top:10px; }
  button.secondary { background:#eee; color:#333; }
  button:active { transform:scale(0.98); }
  button:disabled { opacity:0.65; cursor:default; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .streak { text-align:center; font-size:2.2rem; font-weight:700; margin:10px 0; }
  .streak span { font-size:1rem; color:var(--muted); display:block; font-weight:400; }
  .stat-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee; }
  .stat-row:last-child { border-bottom:none; }
  .qprogress { text-align:center; color:var(--muted); margin-bottom:4px; font-size:0.85rem; }
  .progressbar { height:8px; background:#eee; border-radius:5px; overflow:hidden; margin-bottom:14px; }
  .progressbar-fill { height:100%; background:var(--accent); transition:width .25s ease; }
  .review-badge { display:inline-block; background:#ffe2d1; color:#c2410c; border-radius:20px; padding:2px 10px; font-size:0.75rem; font-weight:600; margin-bottom:6px; }
  .question { font-size:1.1rem; font-weight:600; margin-bottom:18px; line-height:1.5; }
  .choice { display:block; width:100%; text-align:left; background:#fff; border:2px solid #ddd; color:var(--text); margin-bottom:10px; padding:14px; border-radius:12px; font-weight:500; }
  .choice.correct { border-color:var(--good); background:#eafbea; }
  .choice.wrong { border-color:var(--bad); background:#fdeceb; }
  .choice[disabled] { opacity:0.85; }
  .feedback { margin-top:14px; padding:14px; border-radius:12px; background:#f5f5f5; font-size:0.92rem; line-height:1.5; }
  .feedback a { color:var(--accent); font-weight:600; text-decoration:none; }
  .hidden { display:none !important; }
  .top-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; color:var(--muted); font-size:0.85rem; }
  .badge { background:var(--accent); color:#fff; border-radius:20px; padding:2px 10px; font-size:0.8rem; }
  .empty { text-align:center; color:var(--muted); padding:30px 0; }
  .cat { display:inline-block; color:#fff; border-radius:6px; padding:2px 8px; font-size:0.75rem; font-weight:700; letter-spacing:.02em; }
  .cat-ENG { background:#2563eb; } .cat-ISI { background:#7c3aed; } .cat-BIO { background:#16a34a; }
  .cat-COMMON { background:#6b7280; } .cat-IEFT { background:#dc2626; } .cat-TR { background:#e30a17; }
  .quiz-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .lang-toggle { cursor:pointer; color:var(--muted); font-size:0.85rem; user-select:none; }
  /* --- fun layer: CSS-only animations, respects reduced motion --- */
  .screen > div:not(.hidden) { animation:fadeUp .25s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } }
  .choice.correct { animation:pop .35s ease; }
  .choice.wrong { animation:shake .35s ease; }
  @keyframes pop { 50% { transform:scale(1.04); } }
  @keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .toast { position:fixed; left:50%; top:22%; transform:translateX(-50%); font-size:1.6rem; font-weight:800; color:var(--accent);
    text-shadow:0 2px 0 #fff; pointer-events:none; animation:floatUp 1s ease forwards; z-index:10; white-space:nowrap; }
  @keyframes floatUp { from { opacity:0; transform:translate(-50%,10px) scale(.8); } 20% { opacity:1; transform:translate(-50%,0) scale(1.1); } to { opacity:0; transform:translate(-50%,-40px); } }
  .confetti { position:fixed; top:-20px; font-size:1.4rem; pointer-events:none; animation:fall linear forwards; z-index:10; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  .big-num { font-size:3rem; font-weight:800; text-align:center; color:var(--accent); }
  .lb-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eee; }
  .lb-row:last-child { border-bottom:none; }
  .lb-row.me { background:#fff4ee; margin:0 -10px; padding:8px 10px; border-radius:10px; }
  .lb-rank { width:28px; text-align:center; font-weight:700; }
  .lb-bar { flex:1; }
  .lb-name { font-size:0.9rem; display:flex; justify-content:space-between; }
  .lb-track { height:6px; background:#eee; border-radius:4px; overflow:hidden; margin-top:4px; }
  .lb-fill { height:100%; background:var(--accent); border-radius:4px; transform-origin:left; animation:grow .6s ease; }
  @keyframes grow { from { transform:scaleX(0); } }
  button.trivia { background:#e30a17; }
  .thumb { position:fixed; bottom:28%; left:calc(50% + var(--dx)); font-size:2rem; pointer-events:none; z-index:10; opacity:0;
    animation:rise 1.3s ease-out var(--d) forwards; }
  @keyframes rise { from { opacity:0; transform:translate(0,0) scale(.5); } 15% { opacity:1; } to { opacity:0; transform:translate(var(--drift),-50vh) scale(1.3) rotate(var(--rot)); } }
  /* --- ひぐりんご character (inline SVG, mood = class on .higu) --- */
  .higu { display:inline-block; width:64px; height:64px; }
  .higu.big { width:110px; height:110px; }
  .higu svg { width:100%; height:100%; overflow:visible; transform-origin:50% 95%; animation:sway 2.4s ease-in-out infinite; }
  @keyframes sway { 50% { transform:rotate(5deg); } 0%,100% { transform:rotate(-5deg); } }
  .higu .mood { display:none; }
  .higu.normal .m-normal, .higu.happy .m-happy, .higu.combo .m-combo, .higu.sad .m-sad { display:inline; }
  .higu.happy .m-joy, .higu.combo .m-joy { display:inline; }
  .higu.roll { animation:rollIn .7s cubic-bezier(.3,1.3,.5,1); }
  @keyframes rollIn { from { transform:translateX(-140px) rotate(-360deg); } }
  .higu.jump { animation:hop .5s ease; }
  @keyframes hop { 40% { transform:translateY(-22px); } 70% { transform:translateY(0) scaleY(.9); } }
  .higu.spin { animation:spinHop .8s ease; }
  @keyframes spinHop { 50% { transform:translateY(-30px) rotate(360deg); } to { transform:rotate(360deg); } }
  .higu.shake { animation:shake .45s ease; }
  .higu-lane { height:64px; margin:-4px 0 6px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; } }
</style>
</head>
<body>
<div class="screen">

  <!-- Access key screen -->
  <div id="keyScreen">
    <h1>🎓 ひぐりんご<br><small style="font-size:0.9rem;color:#888">九大プログラム学習</small></h1>
    <div class="card">
      <label style="font-weight:600;">合言葉を入力</label>
      <input id="keyInput" type="password" placeholder="担当者に確認してください" style="margin-top:8px;">
      <button id="keySubmitBtn">次へ</button>
      <div id="keyError" class="hidden" style="color:#e0453c;margin-top:10px;font-size:0.9rem;">合言葉が違います</div>
    </div>
  </div>

  <!-- Login screen -->
  <div id="loginScreen" class="hidden">
    <h1>🎓 ひぐりんご<br><small style="font-size:0.9rem;color:#888">九大プログラム学習</small></h1>
    <div class="card">
      <label style="font-weight:600;">担当者名を選択</label>
      <select id="userSelect" style="margin-top:8px;"></select>
      <button id="loginBtn">はじめる</button>
      <hr style="margin:18px 0;border:none;border-top:1px solid #eee;">
      <label style="font-weight:600;">新規登録</label>
      <input id="newUserInput" placeholder="名前を入力" style="margin-top:8px;">
      <button class="secondary" id="newUserBtn">新規で登録してはじめる</button>
    </div>
  </div>

  <!-- Home screen -->
  <div id="homeScreen" class="hidden">
    <div class="top-nav">
      <span id="homeUserName"></span>
      <span>
        <span class="lang-toggle" style="margin-right:14px;">🌐 <b class="lang-label">EN</b></span>
        <span id="switchUserBtn" style="cursor:pointer;">切り替え</span>
      </span>
    </div>
    <div class="card" style="text-align:center;">
      <div class="higu big normal" id="higuHome"></div>
      <div class="streak">🔥 <span id="streakNum">0</span><span>日連続</span></div>
    </div>
    <div class="card">
      <div class="stat-row"><span>今日学習可能な問題</span><b id="dueCount">-</b></div>
      <div class="stat-row"><span>これまでの累計学習数</span><b id="totalSeen">-</b></div>
    </div>
    <button id="startBtn">クイズをはじめる</button>
    <button id="triviaBtn" class="trivia hidden">🇹🇷 雑学だけモード</button>
    <div class="card" style="margin-top:16px;">
      <div style="font-weight:700;margin-bottom:6px;">🏆 ランキング <small style="color:#888;font-weight:400;">習得ポイント</small></div>
      <div id="leaderboard"></div>
    </div>
  </div>

  <!-- Quiz screen -->
  <div id="quizScreen" class="hidden">
    <div class="qprogress"><span id="qIndex">1</span> / <span id="qTotal">1</span> 問</div>
    <div class="progressbar"><div class="progressbar-fill" id="qProgressFill" style="width:0%"></div></div>
    <div class="higu-lane"><div class="higu normal" id="higuQuiz"></div></div>
    <div class="card">
      <div id="reviewBadge" class="review-badge hidden">🔁 復習ラウンド</div>
      <div class="quiz-head">
        <span id="qProgram" class="cat"></span>
        <span class="lang-toggle">🌐 <b class="lang-label">EN</b></span>
      </div>
      <div class="question" id="qText"></div>
      <div id="choicesBox"></div>
      <div id="feedbackBox" class="feedback hidden"></div>
      <button id="nextBtn" class="hidden">次へ</button>
    </div>
  </div>

  <!-- Summary screen -->
  <div id="summaryScreen" class="hidden">
    <h1 id="sumTitle">🎉 おつかれさま！</h1>
    <div class="card">
      <div style="text-align:center;"><div class="higu big happy" id="higuSum"></div></div>
      <div class="big-num">+<span id="sumPoints">0</span></div>
      <div style="text-align:center;color:#888;margin-bottom:10px;">習得ポイント <span id="sumRank"></span></div>
      <div class="stat-row"><span>今回の正答数</span><b id="sumCorrect">-</b></div>
      <div class="stat-row"><span>今回の出題数</span><b id="sumTotal">-</b></div>
      <div class="stat-row"><span>最大コンボ</span><b id="sumCombo">-</b></div>
      <div class="streak">🔥 <span id="sumStreak">0</span><span>日連続</span></div>
    </div>
    <button id="backHomeBtn">ホームに戻る</button>
  </div>

</div>

<script>
// ponytail: API_URL is the one GAS deployment; update after redeploy.
const API_URL = "https://script.google.com/macros/s/AKfycbyCojSmYOdUT9ZQjgRe3V8aotPUMb-tXvCbUMd1FSt1LO7f9EatP2RLJuCIl1ARW6rvtg/exec";
const LS_USER_KEY = "ieft_quiz_user";
const LS_ACCESS_KEY = "ieft_quiz_key";
const LS_LANG_KEY = "ieft_quiz_lang";
const QUIZ_SIZE = 10; // ponytail: fixed round size, no config UI for it

let state = { user:null, accessKey:null, questions:[], idx:0, correctCount:0, answers:[], streak:0,
  lang: localStorage.getItem(LS_LANG_KEY) || "en" };

const $ = (id) => document.getElementById(id);
function show(id) {
  ["keyScreen","loginScreen","homeScreen","quizScreen","summaryScreen"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}

async function apiGet(user) {
  const res = await fetch(`${API_URL}?user=${encodeURIComponent(user)}&key=${encodeURIComponent(state.accessKey)}`);
  return res.json();
}
async function apiPost(user, answers) {
  // text/plain avoids a CORS preflight OPTIONS request that GAS can't answer.
  const res = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({ key: state.accessKey, user, answers }) });
  return res.json();
}

// --- Local-first data layer ---
// Screens render from localStorage instantly; GAS is only a background sync.
// cache: last home payload per user. outbox: finished quizzes not yet POSTed,
// so answers survive closing the tab mid-sync (flushed on next boot).
const LS_CACHE = "ieft_quiz_cache", LS_OUTBOX = "ieft_quiz_outbox";
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const cacheFor = (user) => lsGet(LS_CACHE, {})[user];
function saveCache(user, data) {
  const all = lsGet(LS_CACHE, {});
  all[user] = { questions: data.questions, user: data.user };
  all.__users = data.users || all.__users;
  all.__lb = data.leaderboard || all.__lb;
  lsSet(LS_CACHE, all);
}
const todayJST = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" }); // yyyy-mm-dd
// Same rule as GAS nextStreak(): same day keep, yesterday +1, else 1.
function nextStreak(last, streak, today) {
  if (!last) return 1;
  if (last === today) return streak;
  const y = new Date(today + "T00:00:00Z"); y.setUTCDate(y.getUTCDate() - 1);
  return last === y.toISOString().slice(0, 10) ? streak + 1 : 1;
}
let flushing = null;
function flushOutbox() {
  if (flushing) return flushing;
  flushing = (async () => {
    let box = lsGet(LS_OUTBOX, []);
    while (box.length) {
      const job = box[0];
      const data = await apiPost(job.user, job.answers);
      if (data.error) break;
      box = lsGet(LS_OUTBOX, []).slice(1);
      lsSet(LS_OUTBOX, box);
      if (!box.some(j => j.user === job.user)) { // server state is now authoritative
        saveCache(job.user, { ...data, users: cacheFor("__users") });
        if (job.user === state.user && !$("homeScreen").classList.contains("hidden")) renderHome();
      }
    }
  })().catch(() => {}).finally(() => { flushing = null; });
  return flushing;
}

function shuffle_(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CAT_LABEL = { ENG:"Engineering", ISI:"ISI", BIO:"Bio", COMMON:"Common", IEFT:"IEFT", TR:"🇹🇷 Türkiye" };
// Round mix basic:adv:trivia = 7:1:2. A tier that runs short is backfilled
// from the rest (basic first), so a round is always full while questions last.
const TIER_MIX = { basic:7, adv:1, trivia:2 };
function pickRound_(questions, size) {
  const pools = {};
  shuffle_(questions).forEach(q => (pools[q.tier || "basic"] ||= []).push(q));
  const picked = [];
  for (const [tier, n] of Object.entries(TIER_MIX)) picked.push(...(pools[tier] || []).splice(0, n));
  for (const tier of Object.keys(TIER_MIX)) picked.push(...(pools[tier] || []).splice(0, size - picked.length));
  return shuffle_(picked.slice(0, size));
}

// EN/JA text picker: falls back to JA if an EN field is missing.
function qText(q, field) {
  if (state.lang === "en" && q[field + "_en"]) return q[field + "_en"];
  return q[field];
}
function qChoices(q) {
  return (state.lang === "en" && q.choices_en) ? q.choices_en : q.choices;
}
function syncLangLabels() {
  document.querySelectorAll(".lang-label").forEach(el => el.textContent = state.lang.toUpperCase());
}
// Works on home and mid-question: the quiz re-renders in place, keeping the
// shuffled order and any answer already given.
document.querySelectorAll(".lang-toggle").forEach(el => el.onclick = () => {
  state.lang = state.lang === "en" ? "ja" : "en";
  localStorage.setItem(LS_LANG_KEY, state.lang);
  syncLangLabels();
  if (!$("quizScreen").classList.contains("hidden")) renderQuestion();
});
syncLangLabels();

// Shows a spinner + disables the button while fn() runs, so a slow GAS
// cold-start network call never looks like a frozen page. The rAF yield
// matters even for synchronous fn()s: without it the spinner never paints
// because the browser can't repaint until this sync call stack unwinds.
async function withLoading(btn, label, fn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${label}`;
  await new Promise(requestAnimationFrame);
  try {
    return await fn();
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// --- Access key gate ---
// Returns the probe response (user list) on success so initLogin can reuse it
// instead of making a second cold GAS round-trip.
async function tryKey(key) {
  state.accessKey = key;
  const data = await apiGet(""); // probe: lists users only if key is valid
  if (data.error) {
    $("keyError").classList.remove("hidden");
    state.accessKey = null;
    return null;
  }
  localStorage.setItem(LS_ACCESS_KEY, key);
  return data;
}
$("keySubmitBtn").onclick = async () => {
  const key = $("keyInput").value.trim();
  if (!key) return;
  $("keyError").classList.add("hidden");
  const data = await withLoading($("keySubmitBtn"), "確認中…", () => tryKey(key));
  if (data) { await initLogin(data); show("loginScreen"); }
};

// --- Login ---
async function initLogin(data) {
  data = data || await apiGet(""); // just to list users
  const all = lsGet(LS_CACHE, {}); all.__users = data.users; lsSet(LS_CACHE, all);
  renderUserList(data.users);
}
function renderUserList(list) {
  const users = [...new Set(list || [])];
  const sel = $("userSelect");
  sel.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join("") || `<option disabled>登録済みユーザーなし</option>`;
  const saved = localStorage.getItem(LS_USER_KEY);
  if (saved && users.includes(saved)) sel.value = saved;
}
$("loginBtn").onclick = () => withLoading($("loginBtn"), "読み込み中…", () => login($("userSelect").value));
$("newUserBtn").onclick = () => {
  const name = $("newUserInput").value.trim();
  if (name) withLoading($("newUserBtn"), "読み込み中…", () => login(name));
};
async function login(user) {
  if (!user) return;
  localStorage.setItem(LS_USER_KEY, user);
  state.user = user;
  await goHome();
}
$("switchUserBtn").onclick = () => {
  localStorage.removeItem(LS_USER_KEY);
  renderUserList(cacheFor("__users")); // instant from cache, refresh behind it
  show("loginScreen");
  initLogin().catch(() => {});
};

// --- Home ---
// Cached user -> paint immediately, revalidate in background. Unknown user
// (first login) -> must wait for GAS once.
async function goHome() {
  if (cacheFor(state.user)) {
    renderHome();
    refreshHome();
  } else {
    await refreshHome();
  }
}
async function refreshHome() {
  await flushOutbox(); // never let a stale GET overwrite answers still in flight
  if (lsGet(LS_OUTBOX, []).some(j => j.user === state.user)) return;
  const data = await apiGet(state.user);
  if (data.error) return;
  saveCache(state.user, data);
  if (!$("quizScreen").classList.contains("hidden")) return; // don't yank the quiz
  renderHome();
}
function renderHome() {
  const c = cacheFor(state.user);
  state.questions = c.questions;
  state.streak = c.user.streak;
  $("homeUserName").textContent = state.user + " さん";
  $("streakNum").textContent = state.streak;
  $("dueCount").textContent = c.questions.length;
  $("totalSeen").textContent = c.user.total_seen;
  $("startBtn").disabled = c.questions.length === 0;
  $("startBtn").textContent = c.questions.length === 0 ? "本日分は学習済みです🎉" : "クイズをはじめる";
  // Basics come first: trivia-only mode unlocks once no basic question is due today.
  const basicLeft = c.questions.some(q => (q.tier || "basic") === "basic");
  $("triviaBtn").classList.toggle("hidden", basicLeft || !c.questions.some(q => q.tier === "trivia"));
  renderLeaderboard();
  show("homeScreen");
}
function renderLeaderboard() {
  const lb = cacheFor("__lb") || [];
  const top = Math.max(1, ...lb.map(r => r.score));
  const medal = ["🥇","🥈","🥉"];
  $("leaderboard").innerHTML = lb.map((r, i) => `
    <div class="lb-row${r.user === state.user ? " me" : ""}">
      <span class="lb-rank">${medal[i] || i + 1}</span>
      <div class="lb-bar">
        <div class="lb-name"><span>${esc(r.user)}${r.streak ? ` <small>🔥${r.streak}</small>` : ""}</span><b>${r.score}</b></div>
        <div class="lb-track"><div class="lb-fill" style="width:${Math.round(r.score / top * 100)}%"></div></div>
      </div>
    </div>`).join("") || `<div class="empty">まだ誰も解いていません</div>`;
}
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
$("startBtn").onclick = () => withLoading($("startBtn"), "読み込み中…", () => startQuiz());
$("triviaBtn").onclick = () => startQuiz(state.questions.filter(q => q.tier === "trivia"));
$("backHomeBtn").onclick = renderHome;

// --- Quiz (all client-side: no network per-question, batch POST at the end) ---
// Round model: state.roundQueue is the list of questions still to answer in
// the CURRENT round; state.missed collects ones answered wrong, becoming the
// next round's queue. state.answers accumulates every (qid, correct) pair
// across all rounds for the single batch POST at the very end.
function startQuiz(pool = state.questions) {
  if (pool.length === 0) return;
  state.correctCount = 0;
  state.answers = [];
  state.combo = 0; state.maxCombo = 0;
  state.totalInFirstRound = Math.min(pool.length, QUIZ_SIZE);
  const picked = pickRound_(pool, QUIZ_SIZE);
  state.roundQueue = shuffleQuiz_(picked);
  state.missed = [];
  state.roundIdx = 0; // 0 = first pass, >0 = review round
  state.qDoneInRound = 0;
  show("quizScreen");
  renderQuestion();
}

// Pre-shuffle choice ORDER (indices, not text) per question so the language
// can be switched mid-question without reshuffling.
function shuffleQuiz_(questions) {
  return questions.map(q => {
    const order = shuffle_([0,1,2,3]);
    // selectedIdx reset: review rounds reuse missed question objects, and a
    // carried-over answer would render the question as already answered.
    return { ...q, order, shuffledCorrectIdx: order.indexOf(Number(q.correct_idx)), selectedIdx: null };
  });
}

function renderQuestion() {
  const q = state.roundQueue[state.qDoneInRound];
  $("qIndex").textContent = state.qDoneInRound + 1;
  $("qTotal").textContent = state.roundQueue.length;
  $("qProgressFill").style.width = Math.round((state.qDoneInRound / state.roundQueue.length) * 100) + "%";
  $("reviewBadge").classList.toggle("hidden", state.roundIdx === 0);
  $("qProgram").textContent = CAT_LABEL[q.program] || q.program;
  $("qProgram").className = "cat cat-" + q.program;
  $("qText").textContent = qText(q, "question");
  if (q.selectedIdx == null) higu($("higuQuiz"), "normal", "roll"); // rolls in for each new question
  const choices = qChoices(q);
  const box = $("choicesBox");
  box.innerHTML = "";
  q.order.forEach((orig, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = choices[orig];
    btn.onclick = () => answer(i);
    box.appendChild(btn);
  });
  if (q.selectedIdx == null) {
    $("feedbackBox").classList.add("hidden");
    $("nextBtn").classList.add("hidden");
  } else {
    showFeedback(q);
  }
}

function answer(selectedIdx) {
  const q = state.roundQueue[state.qDoneInRound];
  if (q.selectedIdx != null) return;
  q.selectedIdx = selectedIdx;
  const correct = selectedIdx === q.shuffledCorrectIdx;
  if (correct && state.roundIdx === 0) state.correctCount++; // score = first-attempt accuracy
  state.answers.push({ qid: q.id, correct });
  if (!correct) state.missed.push(q);
  state.combo = correct ? state.combo + 1 : 0;
  state.maxCombo = Math.max(state.maxCombo, state.combo);
  if (state.combo >= 3) { toast(`🔥 ${state.combo} コンボ！`); higu($("higuQuiz"), "combo", "spin"); }
  else if (correct) higu($("higuQuiz"), "happy", "jump");
  else higu($("higuQuiz"), "sad", "shake");
  if (correct) thumbsBurst();
  showFeedback(q);
}

// --- fun layer (DOM + CSS keyframes only, no libs) ---
// ひぐりんご (design A "りんごだるま"): apple-shaped red daruma with a face
// window, topknot + leaf, bushy brows, moustache and goatee (after the owner).
// All moods live in one SVG; the .higu element's class picks which
// <g class="mood m-*"> shows.
const HIGU_SVG = (() => {
  const INK = "#2b2b2b", ey = 58, my = 72, L = 41, R = 59;
  const star = (cx, cy, r) => `<polygon fill="#f5b301" points="${[...Array(10)].map((_, i) => {
    const a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    return (cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1);
  }).join(" ")}"/>`;
  return `<svg viewBox="0 0 100 100" aria-label="ひぐりんご">
  <ellipse cx="50" cy="96" rx="28" ry="3.5" fill="#000" opacity=".12"/>
  <path d="M50 22C32 10 9 22 11 52C13 80 31 95 50 95C69 95 87 80 89 52C91 22 68 10 50 22Z" fill="#e3342f"/>
  <ellipse cx="27" cy="38" rx="4.5" ry="8" fill="#fff" opacity=".3" transform="rotate(30 27 38)"/>
  <ellipse cx="50" cy="60" rx="25" ry="23" fill="#fde7cf"/>
  <path d="M25 56C25 40 36 35 50 35S75 40 75 56C70 46 60 43 50 43S30 46 25 56Z" fill="${INK}"/>
  <circle cx="50" cy="21" r="7.5" fill="${INK}"/>
  <path d="M55 17c5-7 14-6 16-2-5 4-11 5-16 2z" fill="#4caf50"/>
  <path d="M${L-6} ${ey-8}q5-4 11-1M${R-5} ${ey-9}q6-3 11 1" stroke="${INK}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <g class="mood m-joy" fill="#ff8a80" opacity=".6"><ellipse cx="${L-7}" cy="${ey+7}" rx="4" ry="2.4"/><ellipse cx="${R+7}" cy="${ey+7}" rx="4" ry="2.4"/></g>
  <g class="mood m-normal"><circle cx="${L}" cy="${ey}" r="3.2" fill="${INK}"/><circle cx="${R}" cy="${ey}" r="3.2" fill="${INK}"/>
    <path d="M46 ${my}q4 4 8 0z" fill="#c62828"/></g>
  <g class="mood m-happy"><path d="M${L-4} ${ey+1}q4-5 8 0M${R-4} ${ey+1}q4-5 8 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M44 ${my-1}q6 9 12 0z" fill="#c62828"/></g>
  <g class="mood m-combo">${star(L, ey, 5.5)}${star(R, ey, 5.5)}<path d="M43 ${my-1}q7 11 14 0z" fill="#c62828"/></g>
  <g class="mood m-sad"><circle cx="${L}" cy="${ey+1}" r="2.8" fill="${INK}"/><circle cx="${R}" cy="${ey+1}" r="2.8" fill="${INK}"/>
    <path d="M${R+5} ${ey+3}q2.5 5 0 7q-2.5-2 0-7z" fill="#5aa9e6"/>
    <path d="M46 ${my+2}q4-4 8 0" stroke="#c62828" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>
  <path d="M40 ${my-3}q5-5 10-1q5-4 10 1q-5 3-10 0q-5 3-10 0z" fill="${INK}"/>
  <path d="M45 ${my+5}Q50 ${my+13} 55 ${my+5}Q50 ${my+7} 45 ${my+5}Z" fill="${INK}"/>
</svg>`;
})();
document.querySelectorAll(".higu").forEach(el => el.innerHTML = HIGU_SVG);
// mood: normal|happy|combo|sad. anim: roll|jump|spin|shake (restarts even if repeated).
function higu(el, mood, anim) {
  el.className = el.className.replace(/\b(normal|happy|combo|sad|roll|jump|spin|shake)\b/g, "").trim() + " " + mood;
  if (anim) { void el.offsetWidth; el.classList.add(anim); }
}
function thumbsBurst(n = 10) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "thumb";
    el.textContent = "👍";
    el.style.setProperty("--dx", (Math.random() * 60 - 30) + "vw");
    el.style.setProperty("--drift", (Math.random() * 16 - 8) + "vw");
    el.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");
    el.style.setProperty("--d", Math.random() * 0.35 + "s");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }
}
function toast(text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function confetti(n) {
  const bits = ["🎉","✨","🍎","🇹🇷","⭐","🎊"];
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.textContent = bits[i % bits.length];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = 1.5 + Math.random() * 1.5 + "s";
    el.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}
// Mastery points gained this session = change in sum of Leitner boxes.
// Mirrors GAS: correct -> box+1 (max 5), wrong -> box 1, applied in answer order.
function pointsDelta(startBoxes, answers) {
  const box = { ...startBoxes };
  const before = Object.values(box).reduce((a, b) => a + b, 0);
  answers.forEach(a => { box[a.qid] = a.correct ? Math.min((box[a.qid] || 0) + 1, 5) : 1; });
  return Object.values(box).reduce((a, b) => a + b, 0) - before;
}

function showFeedback(q) {
  const correct = q.selectedIdx === q.shuffledCorrectIdx;
  [...document.querySelectorAll(".choice")].forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.shuffledCorrectIdx) btn.classList.add("correct");
    else if (i === q.selectedIdx) btn.classList.add("wrong");
  });
  const fb = $("feedbackBox");
  fb.innerHTML = `${correct ? "✅ 正解！" : "❌ 不正解"} ${qText(q, "explanation")}<br><a href="${q.source_url}" target="_blank" rel="noopener">📄 元の資料を見る（${q.source_page || ""}）</a>`;
  fb.classList.remove("hidden");
  $("nextBtn").classList.remove("hidden");
}

$("nextBtn").onclick = () => withLoading($("nextBtn"), "送信中…", async () => {
  state.qDoneInRound++;
  if (state.qDoneInRound < state.roundQueue.length) {
    renderQuestion();
    return;
  }
  // Round finished: start a review round over the missed questions, or wrap up.
  if (state.missed.length > 0) {
    state.roundQueue = shuffleQuiz_(state.missed);
    state.missed = [];
    state.roundIdx++;
    state.qDoneInRound = 0;
    renderQuestion();
    return;
  }
  // Finish: update the local cache optimistically (answered ids leave today's
  // due list, streak advances) and show the summary now; POST syncs behind.
  const answered = new Set(state.answers.map(a => a.qid));
  const c = cacheFor(state.user);
  const today = todayJST();
  c.questions = c.questions.filter(q => !answered.has(q.id));
  c.user.streak = nextStreak(c.user.last_active_date, Number(c.user.streak) || 0, today);
  c.user.last_active_date = today;
  c.user.total_seen = Number(c.user.total_seen || 0) + [...answered].filter(id => !state.questions.find(q => q.id === id)?.box).length;
  saveCache(state.user, c);
  lsSet(LS_OUTBOX, [...lsGet(LS_OUTBOX, []), { user: state.user, answers: state.answers }]);
  flushOutbox();
  // Optimistic leaderboard: bump my score locally; server copy replaces it after sync.
  const startBoxes = {};
  state.questions.filter(q => answered.has(q.id)).forEach(q => startBoxes[q.id] = Number(q.box) || 0);
  const gained = pointsDelta(startBoxes, state.answers);
  const all = lsGet(LS_CACHE, {});
  const lb = all.__lb || [];
  const rankBefore = lb.findIndex(r => r.user === state.user);
  const me = lb.find(r => r.user === state.user) || (lb.push({ user: state.user, score: 0, streak: 0 }), lb[lb.length - 1]);
  me.score += gained; me.streak = c.user.streak;
  lb.sort((a, b) => b.score - a.score);
  all.__lb = lb; lsSet(LS_CACHE, all);
  const rankNow = lb.indexOf(me);
  $("sumPoints").textContent = gained;
  $("sumRank").textContent = `・${rankNow + 1}位` + (rankBefore > rankNow ? " ⬆️ランクアップ！" : "");
  $("sumCombo").textContent = state.maxCombo;
  const perfect = state.correctCount === state.totalInFirstRound;
  $("sumTitle").textContent = perfect ? "🏆 パーフェクト！" : "🎉 おつかれさま！";
  $("sumCorrect").textContent = state.correctCount;
  $("sumTotal").textContent = state.totalInFirstRound;
  $("sumStreak").textContent = c.user.streak;
  show("summaryScreen");
  higu($("higuSum"), perfect ? "combo" : state.correctCount >= state.totalInFirstRound / 2 ? "happy" : "normal", "spin");
  confetti(perfect || rankBefore > rankNow ? 40 : 15);
});

// --- Boot ---
// Returning user with cache: home paints with zero network; key check and
// refresh happen behind it. Otherwise ping GAS right away so its cold start
// overlaps with the user typing the passphrase.
(async function boot() {
  const savedKey = localStorage.getItem(LS_ACCESS_KEY);
  const savedUser = localStorage.getItem(LS_USER_KEY);
  if (savedKey && savedUser && cacheFor(savedUser)) {
    state.accessKey = savedKey;
    state.user = savedUser;
    renderHome();
    refreshHome().catch(() => {});
    return;
  }
  if (savedKey) {
    const data = await tryKey(savedKey);
    if (data) {
      await initLogin(data);
      if (savedUser) { state.user = savedUser; await goHome(); }
      else show("loginScreen");
      return;
    }
  }
  fetch(API_URL + "?key=").catch(() => {}); // warm-up only
  show("keyScreen");
})();
</script>
